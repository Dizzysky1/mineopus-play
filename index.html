<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MineOpus</title>
<meta name="description" content="A detailed Minecraft remake built with three.js">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:,">
<style>
/* MineOpus: the whole GUI is drawn on #gui (canvas, GUI-scaled, pixelated). */
html, body { margin: 0; padding: 0; overflow: hidden; background: #000; height: 100%; }
body { user-select: none; -webkit-user-select: none; font-family: monospace; cursor: default; }
#game { position: fixed; inset: 0; display: block; image-rendering: pixelated; }
#ui { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 10; }
#ui > * { pointer-events: none; }
#ui canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
#ui #gui { position: absolute; left: 0; top: 0; }
#ui #crosshair { position: absolute; mix-blend-mode: difference; display: none; }

html, body { height: 100%; background: #000; color-scheme: dark; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui"></div>
<script type="module" src="main.js?v=feeafe2181"></script>
</body>
</html>
